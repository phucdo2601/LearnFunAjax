<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../bootstrap/css/font-awesome-5.8.1.css">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="../bootstrap/css/mdb.css">
    <title>AJAX REST API</title>
</head>

<nav class="navbar navbar-dark bg-dark">
    <a href="#" class="navbar-brand">AJAX REST API</a>
</nav>

<div class="container mt-3">
    <div class="row">
        <div class="col text-center">
            <button type="button" class="btn btn-primary" id="get-btn">
                GET
            </button>

            <button type="button" class="btn btn-success" id="post-btn">
                POST
            </button>

            <button type="button" class="btn btn-warning" id="put-btn">
                PUT
            </button>

            <button type="button" class="btn btn-danger" id="delete-btn">
                DELETE
            </button>
        </div>
    </div>
</div>


<div class="container mt-3">
    <div class="row">
        <div class="col">
            <table class="table table-hover text-center table-secondary table-striped">
                <thead class="bg-secondary text-white">
                    <tr>
                        <th>EMP ID</th>
                        <th>FIRST NAME</th>
                        <th>LAST NAME</th>
                        <th>EMAIL</th>
                        <th>GENDER</th>
                        <th>IP ADDRESS</th>
                    </tr>
                </thead>

                <tbody id="table-body">

                </tbody>
            </table>
        </div>

    </div>
</div>

<body>
    <!-- Bootstrap JS File -->
    <script src="../jquery/jquery-3.4.0.js"></script>
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.js"></script>
    <script src="../bootstrap/js/mdb.js"></script>

    <script type="module" src="./app.js"></script>
</body>

</html>
